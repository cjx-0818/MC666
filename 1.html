<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部署成功 | GitHub Pages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            min-height: 100vh;
            background-color: #0d1117;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #f0f6fc;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
        }
        .success-icon {
            font-size: 100px;
            color: #2ea043;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 16px;
            color: #ffffff;
        }
        .desc {
            font-size: 18px;
            color: #8b949e;
            margin-bottom: 40px;
        }
        .info-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px 32px;
            max-width: 500px;
        }
        .info-box p {
            margin: 12px 0;
            font-size: 16px;
            color: #c9d1d9;
        }
        .highlight {
            color: #58a6ff;
        }
        footer {
            position: fixed;
            bottom: 30px;
            color: #6e7681;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✓</div>
        <h1>GitHub网站部署成功</h1>
        <p class="desc">恭喜！你的静态网站已正常发布至 GitHub Pages</p>

        <div class="info-box">
            <p>仓库地址：<span class="highlight">你的GitHub仓库地址</span></p>
            <p>访问域名：<span class="highlight">xxx.github.io</span></p>
            <p>部署状态：<span style="color:#2ea043">正常运行</span></p>
        </div>
    </div>

    <footer>
        Powered by GitHub Pages · 静态站点部署页面
    </footer>
</body>
</html>
